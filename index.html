<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>AutoTech Photo Gallery | කාර්මික ඡායාරූප එකතුව</title>
  <meta name="description" content="අඩු connection ස්පීඩ් එකක උනත් වේගයෙන් ලෝඩ් වන, Touch swipe සහ Zoom පහසුකම් සහිත නවීන Mobile Responsive ඡායාරූප ගැලරිය.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow effects -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AutoTech Gallery</h1>
          <p class="subtitle">කාර්මික ඡායාරූප එකතුව</p>
        </div>
      </div>

      <div class="header-badges">
        <span class="badge badge-count" id="photoCountBadge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span id="photoCount">13</span> ඡායාරූප
        </span>

        <span class="badge badge-network" id="networkBadge" title="Connection Speed Status">
          <span class="pulse-dot"></span>
          <span id="networkStatusText">වේගවත් (Fast)</span>
        </span>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="view-toggles" role="group" aria-label="Layout view switcher">
        <button class="toggle-btn active" data-view="grid" title="Grid View (සමබර)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
          </svg>
          <span>Grid</span>
        </button>
        <button class="toggle-btn" data-view="masonry" title="Masonry View (ස්වභාවික ප්‍රමාණය)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 3h8v12H3V3zm10 0h8v6h-8V3zm0 8h8v10h-8V11zm-10 6h8v4H3v-4z"/>
          </svg>
          <span>Masonry</span>
        </button>
        <button class="toggle-btn" data-view="large" title="Showcase View (විශාල)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 4h16v16H4V4z"/>
          </svg>
          <span>Large</span>
        </button>
      </div>

      <div class="action-buttons">
        <!-- Data Saver Toggle -->
        <button class="btn btn-outline" id="dataSaverBtn" title="අඩු Connection සඳහා දත්ත ඉතිරි කිරීම">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
          <span id="dataSaverText">Data Saver</span>
        </button>

        <!-- Slideshow Button -->
        <button class="btn btn-primary" id="startSlideshowBtn" title="ස්වයංක්‍රීයව ඡායාරූප පෙන්වීම">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Slideshow</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Gallery Container -->
  <main class="main-content">
    <div class="gallery-container" id="galleryGrid" data-view="grid">
      <!-- Photos will be dynamically rendered here with skeleton loaders -->
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-hidden="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>

    <!-- Top Floating Toolbar -->
    <div class="lightbox-toolbar">
      <div class="lightbox-info">
        <span class="lightbox-counter" id="lightboxCounter">1 / 13</span>
        <span class="lightbox-title" id="lightboxTitle">photo_1.jpg</span>
      </div>

      <div class="lightbox-actions">
        <!-- Zoom controls -->
        <button class="icon-btn" id="zoomOutBtn" title="කුඩා කරන්න (Zoom Out: -)" aria-label="Zoom Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button class="icon-btn zoom-level-btn" id="zoomResetBtn" title="නැවත සාමාන්‍ය කරන්න (Reset)">
          <span id="zoomPercent">100%</span>
        </button>
        <button class="icon-btn" id="zoomInBtn" title="විශාල කරන්න (Zoom In: +)" aria-label="Zoom In">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>

        <!-- Slideshow Toggle -->
        <button class="icon-btn" id="lightboxSlideshowBtn" title="ස්වයංක්‍රීය ධාවනය (Slideshow: Space)">
          <svg class="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg class="pause-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <!-- Fullscreen Button -->
        <button class="icon-btn" id="fullscreenBtn" title="සම්පූර්ණ තිරය (Fullscreen: F)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>

        <!-- Download Button -->
        <a class="icon-btn" id="downloadBtn" download title="බාගන්න (Download Photo)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </a>

        <!-- Close Button -->
        <button class="icon-btn close-btn" id="closeLightboxBtn" title="වසන්න (Close: Esc)" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Viewport for Swipe & View -->
    <div class="lightbox-stage" id="lightboxStage">
      <!-- Previous Navigation Arrow -->
      <button class="nav-btn prev-btn" id="prevBtn" title="කලින් ඡායාරූපය (Previous: Left Arrow / Swipe Right)" aria-label="Previous Photo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <!-- Image Slide Container -->
      <div class="lightbox-track" id="lightboxTrack">
        <div class="lightbox-slide" id="lightboxSlide">
          <div class="lightbox-spinner" id="lightboxSpinner">
            <div class="spinner-ring"></div>
            <span>පින්තූරය ලෝඩ් වේ...</span>
          </div>
          <img id="lightboxImg" class="lightbox-image" src="" alt="Enlarged photo" draggable="false">
        </div>
      </div>

      <!-- Next Navigation Arrow -->
      <button class="nav-btn next-btn" id="nextBtn" title="ඊළඟ ඡායාරූපය (Next: Right Arrow / Swipe Left)" aria-label="Next Photo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <!-- Swipe indicator hint on mobile -->
      <div class="swipe-hint" id="swipeHint">
        <span>👈 හරහට අදින්න (Swipe to navigate) 👉</span>
      </div>
    </div>

    <!-- Bottom Thumbnail Carousel Strip -->
    <div class="lightbox-bottom">
      <div class="thumbnail-strip-container">
        <div class="thumbnail-strip" id="thumbnailStrip">
          <!-- Filmstrip thumbnails rendered by JS -->
        </div>
      </div>
    </div>

    <!-- Slideshow Progress Bar -->
    <div class="slideshow-progress" id="slideshowProgress"></div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
